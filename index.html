<!-- 1. Package Selection -->
<div class="packages">
  <div class="package" onclick="selectPlan('instagram', 1000, 50)">
    <h3>Instagram Growth</h3>
    <p>1000 Followers</p>
    <strong>KES 500</strong> <!-- or USD -->
  </div>
  <!-- More packages... -->
</div>

<!-- 2. Input for their social media URL -->
<input type="url" id="target-url" placeholder="Enter Instagram profile URL..." required>

<!-- 3. Payment Form -->
<form id="checkout-form">
  <div id="card-element"><!-- Stripe Element --></div>
  <button id="pay-btn">Pay Now</button>
</form>

<!-- 4. Status Tracker (Post-payment) -->
<div id="order-status" style="display:none">
  <p>Status: <span id="status-text">Processing...</span></p>
  <progress id="delivery-progress"></progress>
  <div id="current-count">0 / 1000 followers added</div>
</div>
